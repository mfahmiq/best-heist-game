<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Gilded Vault — a midnight heist</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07090f; }
  body { display: flex; align-items: center; justify-content: center; }
  #game {
    display: block;
    width: min(100vw, 150vh);
    height: auto;
    max-height: 100vh;
    aspect-ratio: 3 / 2;
    touch-action: none;
    cursor: crosshair;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<noscript><p style="color:#e8ecf4;font-family:sans-serif;text-align:center;margin-top:40vh">The Gilded Vault needs JavaScript to play.</p></noscript>
<canvas id="game" aria-label="The Gilded Vault: sneak past the guards and cameras, steal the Star of Meridia, and escape before the alarm hits 100 percent"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
